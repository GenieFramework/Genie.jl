name: Julia CI

on:
  push:
    branches: [main, master]

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

  issue_comment:
    types:
      - created

  workflow_dispatch:
    inputs:
      feature:
        type: choice
        description: What to run
        options:
          - DocDeploy
          - LintAndTest
          - TagBot

jobs:
  julia-ci:
    uses: julia-testitems/testitem-workflow/.github/workflows/juliaci.yml@v2

    with:
      # Select only the current stable Julia release.
      # If the current stable release is Julia 1.12, this produces Julia 1.12.
      include-release-versions: true
      include-lts-versions: false
      include-all-compatible-minor-versions: false
      include-smallest-compatible-minor-versions: false
      include-rc-versions: false
      include-beta-versions: false
      include-alpha-versions: false
      include-nightly-versions: false

      # Keep only Ubuntu Linux x64 and Ubuntu Linux x86.
      include-windows-x64: false
      include-windows-x86: false
      include-linux-x64: true
      include-linux-x86: true
      include-macos-x64: false
      include-macos-aarch64: false

      # Preserve the previous policy: x86 may fail without failing the workflow.
      allow-failure: "*~x86"

      # First diagnostic change: remove test-item and Julia thread concurrency.
      max-workers: "1"
      threads: "1"

    permissions: write-all

    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}